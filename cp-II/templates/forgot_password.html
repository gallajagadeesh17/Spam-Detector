<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spam Detector | AI-Powered Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>
<body class="auth-page">

    

    <div id="loader-wrapper">
        <div class="loader-container">
            <div class="cyber-spinner"></div>
            <div class="loading-text">
                <span>S</span><span>C</span><span>A</span><span>N</span><span>N</span><span>I</span><span>N</span><span>G</span>
            </div>
        </div>
    </div>

    <div class="forgot-card">
            <h2>Forgot Password</h2>
            <p>Enter your email to receive a reset code.</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('request_otp') }}" method="POST">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn-reset">Send OTP</button>
            </form>
            
            <div class="auth-footer" style="margin-top: 20px;">
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </div>
<script>
window.addEventListener("load", function() {
    setTimeout(() => {
        document.getElementById("loader-wrapper").classList.add("loader-hidden");
    }, 600);
});
</script>
</body>
</html>
