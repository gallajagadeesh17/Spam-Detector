<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector | AI-Powered Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>
<body>


    <div id="loader-wrapper">
        <div class="loader-container">
            <div class="cyber-spinner"></div>
            <div class="loading-text">
                <span>S</span><span>C</span><span>A</span><span>N</span><span>N</span><span>I</span><span>N</span><span>G</span>
            </div>
        </div>
    </div>

    <div class="recovery-wrapper">
        <div class="recovery-card">
            <h2>Reset Password</h2>
            <p>Enter your new password below.</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('update_password') }}" method="POST">
                <div class="form-group">
                    <input type="password" name="new_password" placeholder="New Password" required>
                </div>
                <div class="form-group">
                    <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
                </div>
                <button type="submit" class="btn-reset">Reset Password</button>
            </form>
        </div>
    </div>
<script>
window.addEventListener("load", function() {
    setTimeout(() => {
        document.getElementById("loader-wrapper").classList.add("loader-hidden");
    }, 600);
});
</script>
</body>
</html>
